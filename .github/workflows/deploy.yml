name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.VM_BE_PATH }}

            git fetch origin main
            git reset --hard origin/main

            docker compose pull || true
            docker compose up -d --build

            docker compose ps

            echo "Waiting for backend to become healthy..."
            healthy=0
            for i in $(seq 1 36); do
              sleep 5
              status="$(docker compose ps backend --format '{{.Status}}' 2>/dev/null || true)"
              echo "Attempt $i/36 — container: ${status:-unknown}"

              if echo "$status" | grep -qi restarting; then
                echo "Backend container is restarting — recent logs:"
                docker compose logs backend --tail 30 || true
              fi

              if curl -fsS http://127.0.0.1:5000/api/v1/health > /dev/null 2>&1; then
                echo "Backend is healthy"
                healthy=1
                break
              fi
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Health check failed after 180s"
              docker compose ps
              docker compose logs backend --tail 100
              exit 1
            fi
