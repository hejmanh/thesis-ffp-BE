            application/json:
              schema:
                $ref: '#/components/schemas/Scenario4OutputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 4 output not found
  /reference/currencies:
    get:
      tags: [Reference]
      summary: List currencies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyListResponse'

  /reference/countries:
    get:
      tags: [Reference]
      summary: List countries
      description: Returns localized country names when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'

  /reference/sex-types:
    get:
      tags: [Reference]
      summary: List sex types
      description: Returns localized titles when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SexTypeListResponse'

  /reference/asset-types:
    get:
      tags: [Reference]
      summary: List asset types
      description: Returns localized titles when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetTypeListResponse'

  /reference/scenario-types:
    get:
      tags: [Reference]
      summary: List scenario types
      description: Returns localized titles and descriptions when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioTypeListResponse'

  /reference/life-stage-ranges:
    get:
      tags: [Reference]
      summary: List life stage ranges
      description: Returns localized titles when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/BirthYear'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifeStageRangeListResponse'

  /reference/smoking-types:
    get:
      tags: [Reference]
      summary: List smoking types
      description: Returns localized titles when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
