              schema:
                $ref: '#/components/schemas/Scenario3OutputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 3 output not found

  /scenario-4/input:
    get:
      tags: [Scenario 4]
      summary: Get scenario 4 input
      description: Returns the saved Scenario 4 input, including life expectancy, target FFP age, and annual spending at FFP.
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario4InputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 4 input not found
    post:
      tags: [Scenario 4]
      summary: Create scenario 4 input
      description: Creates Scenario 4 input with life expectancy, target FFP age, and annual spending at FFP.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario4InputRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario4InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [Scenario 4]
      summary: Update scenario 4 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario4InputRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario4InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Scenario 4 input not found

  /scenario-4/output:
