openapi: 3.0.0
info:
  title: FFP API
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Auth
  - name: User Info
  - name: Reference

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/financial:
    get:
      tags: [User Info]
      summary: Get financial section
      description: "Returns the current user's financial section, including financial profile, portfolio allocations, and lifestyle profile."
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFinancialInfoResponse'
    post:
      tags: [User Info]
      summary: Create financial section
      description: 'Creates the combined financial section in one request, including financial profile, both portfolio allocations, and lifestyle profile.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialInfoEnvelope'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFinancialInfoResponse'
    patch:
      tags: [User Info]
      summary: Update financial section
      description: 'Updates the existing financial section through one endpoint. You can update financialProfile, portfolioAllocations, lifestyleProfile, or any combination of them.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinancialInfoRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFinancialInfoResponse'

  /user-info/assets:
    get:
      tags: [User Info]
      summary: List all assets
      description: 'Returns all post-FFP assets for the authenticated user. Each item includes a uid for use in update and delete operations.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
        401:
          description: Unauthorized
        404:
          description: Profile not found
    post:
      tags: [User Info]
      summary: Add assets
      description: 'Adds one or more post-FFP assets to the profile. Returns the uid and amounts for each newly created asset.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetsRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssetsResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [User Info]
      summary: Partially update asset data
      description: 'Updates only the provided asset items (identified by uid). Unmentioned assets are left unchanged.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetDataRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/assets/{uid}:
    delete:
      tags: [User Info]
      summary: Delete a single post-FFP asset
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the asset to delete (returned by GET /user-info/assets)
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/stages:
    get:
      tags: [User Info]
      summary: Get stage data
      description: 'Returns the saved stage data for the authenticated user.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStageDataResponse'
    post:
      tags: [User Info]
      summary: Create stage data
      description: "Creates only the stage rows included in this request. The frontend can first fetch the eligible stages from GET /reference/life-stage-ranges?birthYear=YYYY, let the user fill values for those returned stages, then submit the selected stage items here. Every submitted lifeStageRangeId must still be eligible for the authenticated user's birth year, and existing stage rows in the profile cannot be created again."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStageDataRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Profile not found
    patch:
      tags: [User Info]
      summary: Partially update stage data
      description: 'Updates only the provided stage items (identified by lifeStageRangeId). Unmentioned stages are left unchanged.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStageDataRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /reference/currencies:
    get:
      tags: [Reference]
      summary: List currencies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyListResponse'

  /reference/countries:
    get:
      tags: [Reference]
      summary: List countries
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'

  /reference/sex-types:
    get:
      tags: [Reference]
      summary: List sex types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SexTypeListResponse'

  /reference/asset-types:
    get:
      tags: [Reference]
      summary: List asset types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetTypeListResponse'

  /reference/scenario-types:
    get:
      tags: [Reference]
      summary: List scenario types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioTypeListResponse'

  /reference/life-stage-ranges:
    get:
      tags: [Reference]
      summary: List life stage ranges
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/BirthYear'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifeStageRangeListResponse'

  /reference/smoking-types:
    get:
      tags: [Reference]
      summary: List smoking types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmokingTypeListResponse'

  /reference/physical-activity-types:
    get:
      tags: [Reference]
      summary: List physical activity types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalActivityTypeListResponse'

  /reference/diet-quality-types:
    get:
      tags: [Reference]
      summary: List diet quality types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietQualityTypeListResponse'

  /reference/alcohol-consumption-types:
    get:
      tags: [Reference]
      summary: List alcohol consumption types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlcoholConsumptionTypeListResponse'

  /reference/estimate-life-expectancy:
    get:
      tags: [Reference]
      summary: Get life expectancy estimate
      description: 'Returns the base life expectancy for the authenticated user based on their registered country and sex.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateLifeExpectancyResponse'
        401:
          description: Unauthorized
        404:
          description: Life expectancy data unavailable for the user's country and sex

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum: [asc, desc]
    BirthYear:
      in: query
      name: birthYear
      schema:
        type: integer
  schemas:
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        sort:
          type: string
          enum: [asc, desc]
    ApiResponseBase:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        path:
          type: string
        message:
          type: string
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: ok
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null
    User:
      type: object
      properties:
        id:
          type: string
          description: External UUID
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
                user:
                  $ref: '#/components/schemas/User'
                isFirstLogin:
                  type: boolean
    RefreshResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
    RegisterRequest:
      type: object
      required: [email, password, name, birthYear, countryId, sexTypeId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        birthYear:
          type: integer
        countryId:
          type: integer
        sexTypeId:
          type: integer
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
    FinancialProfileRequest:
      type: object
      required: [desiredLifeExpectancy, currentSavings, currencyCode]
      properties:
        desiredLifeExpectancy:
          type: integer
        currentSavings:
          type: number
        currencyCode:
          type: string
          example: USD
    PortfolioAllocationRequest:
      type: object
      required: [allocationType, u, mu, rf]
      properties:
        allocationType:
          type: string
          enum: [PRE_FFP, POST_FFP]
        u:
          type: number
        mu:
          type: number
        rf:
          type: number
    CreateAssetItem:
      type: object
      required: [assetTypeId, initialAnnualIncome, growthRate]
      properties:
        assetTypeId:
          type: integer
        initialAnnualIncome:
          type: number
          minimum: 0
        growthRate:
          type: number
    CreateAssetsRequest:
      type: object
      required: [assetData]
      properties:
        assetData:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateAssetItem'
    CreatedAssetItem:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        initialAnnualIncome:
          type: number
        growthRate:
          type: number
    CreateAssetsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CreatedAssetItem'
    ListAssetsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AssetDataResponse'
    LifestyleProfileRequest:
      type: object
      required:
        [
          smokingCode,
          physicalActivityCode,
          dietQualityCode,
          alcoholConsumptionCode,
        ]
      properties:
        smokingCode:
          type: string
          example: NON_SMOKER
        physicalActivityCode:
          type: string
          description: Accepts canonical codes such as active, moderate, sedentary, and common aliases such as HIGH, MEDIUM, LOW.
          example: HIGH
        dietQualityCode:
          type: string
          description: Accepts canonical codes such as healthy, average, poor, and common aliases such as HIGH, MEDIUM, LOW.
          example: MEDIUM
        alcoholConsumptionCode:
          type: string
          description: Accepts canonical codes such as none, moderate, heavy, and common aliases such as LOW, MEDIUM, HIGH.
          example: LOW
    StageDataRequest:
      type: object
      required: [lifeStageRangeId, initialAnnualSavings, growthRate]
      properties:
        lifeStageRangeId:
          type: integer
          description: Life stage range ID previously returned by the server for this user's birth year.
        initialAnnualSavings:
          type: number
        growthRate:
          type: number
    AssetDataRequest:
      type: object
      required: [assetTypeId, initialAnnualIncome, growthRate]
      properties:
        assetTypeId:
          type: integer
        initialAnnualIncome:
          type: number
        growthRate:
          type: number
    UpdateFinancialProfileBasicRequest:
      type: object
      description: At least one field must be provided. estimatedLifeExpectancy is read-only and excluded.
      properties:
        currentSavings:
          type: number
          minimum: 0
        desiredLifeExpectancy:
          type: integer
          minimum: 1
          maximum: 150
        currencyCode:
          type: string
          description: 3-letter ISO currency code
          example: USD
    UpdatePortfolioAllocationsRequest:
      type: array
      description: Must contain exactly two items — one PRE_FFP and one POST_FFP.
      minItems: 2
      maxItems: 2
      items:
        $ref: '#/components/schemas/PortfolioAllocationRequest'
    UpdateStageItemRequest:
      type: object
      required: [lifeStageRangeId]
      description: At least one of initialAnnualSavings or growthRate must be provided.
      properties:
        lifeStageRangeId:
          type: integer
          description: Must be a lifeStageRangeId already in this profile.
        initialAnnualSavings:
          type: number
        growthRate:
          type: number
    UpdateStageDataRequest:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/UpdateStageItemRequest'
    CreateStageDataRequest:
      type: array
      description: One or more stage items selected from the life stages previously returned by GET /reference/life-stage-ranges for the user's birth year.
      minItems: 1
      items:
        $ref: '#/components/schemas/StageDataRequest'
    UpdateAssetItemRequest:
      type: object
      required: [uid]
      description: At least one of initialAnnualIncome or growthRate must be provided.
      properties:
        uid:
          type: string
          format: uuid
          description: UUID of the asset to update (returned by GET /user-info/assets).
        initialAnnualIncome:
          type: number
          minimum: 0
        growthRate:
          type: number
    UpdateAssetDataRequest:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/UpdateAssetItemRequest'
    FinancialProfileData:
      type: object
      required: [currentSavings, desiredLifeExpectancy, estimatedLifeExpectancy, currencyCode]
      properties:
        currentSavings:
          type: number
        desiredLifeExpectancy:
          type: integer
        estimatedLifeExpectancy:
          type: integer
        currencyCode:
          type: string
    PortfolioAllocationData:
      type: object
      required: [allocationType, u, mu, rf]
      properties:
        allocationType:
          type: string
          enum: [PRE_FFP, POST_FFP]
        u:
          type: number
        mu:
          type: number
        rf:
          type: number
    StageDataResponse:
      type: object
      properties:
        lifeStageRangeId:
          type: integer
        stageNo:
          type: integer
          nullable: true
        title:
          type: string
        beginningAge:
          type: integer
          nullable: true
        endingAge:
          type: integer
          nullable: true
        initialAnnualSavings:
          type: number
          nullable: true
        growthRate:
          type: number
          nullable: true
    AssetDataResponse:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: UUID of this asset — use this to update or delete the specific asset.
        assetId:
          type: integer
        assetTypeCode:
          type: string
          nullable: true
        assetTypeTitle:
          type: string
          nullable: true
        initialAnnualIncome:
          type: number
          nullable: true
        growthRate:
          type: number
          nullable: true
    LifestyleProfileResponse:
      type: object
      required: [smokingCode, physicalActivityCode, dietQualityCode, alcoholConsumptionCode]
      properties:
        smokingCode:
          type: string
        physicalActivityCode:
          type: string
        dietQualityCode:
          type: string
        alcoholConsumptionCode:
          type: string
    FinancialInfo:
      type: object
      required: [financialProfile, portfolioAllocations, lifestyleProfile]
      properties:
        financialProfile:
          $ref: '#/components/schemas/FinancialProfileRequest'
        portfolioAllocations:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PortfolioAllocationRequest'
        lifestyleProfile:
          $ref: '#/components/schemas/LifestyleProfileRequest'
    FinancialInfoEnvelope:
      type: object
      properties:
        financial:
          $ref: '#/components/schemas/FinancialInfo'
    UpdateFinancialInfoRequest:
      type: object
      description: At least one of financialProfile, portfolioAllocations, or lifestyleProfile must be provided.
      properties:
        financialProfile:
          $ref: '#/components/schemas/UpdateFinancialProfileBasicRequest'
        portfolioAllocations:
          $ref: '#/components/schemas/UpdatePortfolioAllocationsRequest'
        lifestyleProfile:
          $ref: '#/components/schemas/LifestyleProfileRequest'
    GetFinancialInfo:
      type: object
      required: [financialProfile, portfolioAllocations, lifestyleProfile]
      properties:
        financialProfile:
          $ref: '#/components/schemas/FinancialProfileData'
        portfolioAllocations:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PortfolioAllocationData'
        lifestyleProfile:
          $ref: '#/components/schemas/LifestyleProfileResponse'
    GetFinancialInfoEnvelope:
      type: object
      properties:
        financial:
          $ref: '#/components/schemas/GetFinancialInfo'
    GetFinancialInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GetFinancialInfoEnvelope'
    CreateFinancialInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GetFinancialInfoEnvelope'
    UpdateFinancialInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
