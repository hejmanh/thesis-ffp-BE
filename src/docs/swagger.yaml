openapi: 3.0.0
info:
  title: FFP API
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Auth
  - name: User Info - Financial
  - name: User Info - Stages
  - name: User Info - Assets
  - name: User Info - Lifestyle
  - name: Scenario 1
  - name: Scenario 2
  - name: Scenario 3
  - name: Scenario 4
  - name: Reference

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        429:
          $ref: '#/components/responses/AuthRateLimitError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh token and CSRF token cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        429:
          $ref: '#/components/responses/AuthRateLimitError'


  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        429:
          $ref: '#/components/responses/PasswordResetRateLimitError'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        429:
          $ref: '#/components/responses/PasswordResetRateLimitError'

  /auth/update-password:
    post:
      tags: [Auth]
      summary: Update password
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        429:
          $ref: '#/components/responses/AuthRateLimitError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh token and CSRF token cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        429:
          $ref: '#/components/responses/EmailVerificationRateLimitError'

  /auth/resend-verification-email:
    post:
      tags: [Auth]
      summary: Resend verification email
      description: Sends a new verification email when the account exists and is not already verified. The response is intentionally generic to avoid revealing registered emails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmailRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        429:
          $ref: '#/components/responses/EmailVerificationRateLimitError'

  /user-info/financial:
    get:
      tags: [User Info - Financial]
      summary: Get financial section
      description: "Returns the current user's financial section, including financial profile, portfolio allocations, and lifestyle profile."
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFinancialInfoResponse'
    post:
      tags: [User Info - Financial]
      summary: Create financial section
      description: 'Creates the combined financial section in one request, including financial profile, both portfolio allocations, and lifestyle profile.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialInfoEnvelope'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFinancialInfoResponse'
    patch:
      tags: [User Info - Financial]
      summary: Update financial section
      description: 'Updates the existing financial section through one endpoint. You can update financialProfile, portfolioAllocations, lifestyleProfile, or any combination of them.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinancialInfoRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFinancialInfoResponse'

  /user-info/me:
    get:
      tags: [User Info]
      summary: Get user info context
      description: 'Returns profile context details for the authenticated user.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoContextResponse'
        401:
          description: Unauthorized
        404:
          description: Profile not found

  /user-info/assets:
    get:
      tags: [User Info - Assets]
      summary: List all assets
      description: 'Returns all post-FFP assets for the authenticated user. Each item includes a uid for use in update and delete operations.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
        401:
          description: Unauthorized
        404:
          description: Profile not found
    post:
      tags: [User Info - Assets]
      summary: Add assets
      description: 'Adds one or more post-FFP assets to the profile. Returns the uid and amounts for each newly created asset.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetsRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssetsResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [User Info - Assets]
      summary: Partially update asset data
      description: 'Updates only the provided asset items (identified by uid). Unmentioned assets are left unchanged.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetDataRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/assets/{uid}:
    delete:
      tags: [User Info - Assets]
      summary: Delete a single post-FFP asset
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the asset to delete (returned by GET /user-info/assets)
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/life-stages:
    get:
      tags: [User Info - Stages]
      summary: Get stage data
      description: 'Returns the saved stage data for the authenticated user.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStageDataResponse'
    post:
      tags: [User Info - Stages]
      summary: Create stage data
      description: "Creates only the stage rows included in this request. The frontend can first fetch the eligible stages from GET /reference/life-stage-ranges?birthYear=YYYY, let the user fill values for those returned stages, then submit the selected stage items here. Every submitted lifeStageRangeId must still be eligible for the authenticated user's birth year, and existing stage rows in the profile cannot be created again."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStageDataRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Profile not found
    patch:
      tags: [User Info - Stages]
      summary: Partially update stage data
      description: 'Updates only the provided stage items (identified by lifeStageRangeId). Unmentioned stages are left unchanged.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStageDataRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/lifestyle:
    patch:
      tags: [User Info - Lifestyle]
      summary: Update lifestyle profile
      description: 'Updates all four lifestyle habits at once (smoking, physical activity, diet quality, alcohol consumption). All four fields are required. Returns the updated lifestyle and recalculated estimated life expectancy.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifestyleProfileRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLifestyleProfileResponse'
        401:
          description: Unauthorized
        404:
          description: Profile not found

  /scenario-1/input:
    get:
      tags: [Scenario 1]
      summary: Get scenario 1 input
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario1InputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 1 input not found
    post:
      tags: [Scenario 1]
      summary: Create scenario 1 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario1InputRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario1InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [Scenario 1]
      summary: Update scenario 1 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario1InputRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario1InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Scenario 1 input not found

  /scenario-1/output:
    get:
      tags: [Scenario 1]
      summary: Get scenario 1 output
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario1OutputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 1 output not found

  /scenario-2/input:
    get:
      tags: [Scenario 2]
      summary: Get scenario 2 input
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario2InputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 2 input not found
    post:
      tags: [Scenario 2]
      summary: Create scenario 2 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario2InputRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario2InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [Scenario 2]
      summary: Update scenario 2 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario2InputRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario2InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Scenario 2 input not found

  /scenario-2/output:
    get:
      tags: [Scenario 2]
      summary: Get scenario 2 output
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario2OutputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 2 output not found
  /scenario-3/input:
    get:
      tags: [Scenario 3]
      summary: Get scenario 3 input
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario3InputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 3 input not found
    post:
      tags: [Scenario 3]
      summary: Create scenario 3 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario3InputRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario3InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [Scenario 3]
      summary: Update scenario 3 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario3InputRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario3InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Scenario 3 input not found

  /scenario-3/output:
    get:
      tags: [Scenario 3]
      summary: Get scenario 3 output
