openapi: 3.0.0
info:
  title: FFP API
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Auth
  - name: User Info - Financial
  - name: User Info - Stages
  - name: User Info - Assets
  - name: User Info - Lifestyle
  - name: Scenario 1
  - name: Scenario 2
  - name: Reference

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/financial:
    get:
      tags: [User Info - Financial]
      summary: Get financial section
      description: "Returns the current user's financial section, including financial profile, portfolio allocations, and lifestyle profile."
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFinancialInfoResponse'
    post:
      tags: [User Info - Financial]
      summary: Create financial section
      description: 'Creates the combined financial section in one request, including financial profile, both portfolio allocations, and lifestyle profile.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialInfoEnvelope'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFinancialInfoResponse'
    patch:
      tags: [User Info - Financial]
      summary: Update financial section
      description: 'Updates the existing financial section through one endpoint. You can update financialProfile, portfolioAllocations, lifestyleProfile, or any combination of them.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinancialInfoRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFinancialInfoResponse'

  /user-info/me:
    get:
      tags: [User Info]
      summary: Get user info context
      description: 'Returns profile context details for the authenticated user.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoContextResponse'
        401:
          description: Unauthorized
        404:
          description: Profile not found

  /user-info/assets:
    get:
      tags: [User Info - Assets]
      summary: List all assets
      description: 'Returns all post-FFP assets for the authenticated user. Each item includes a uid for use in update and delete operations.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
        401:
          description: Unauthorized
        404:
          description: Profile not found
    post:
      tags: [User Info - Assets]
      summary: Add assets
      description: 'Adds one or more post-FFP assets to the profile. Returns the uid and amounts for each newly created asset.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetsRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssetsResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [User Info - Assets]
      summary: Partially update asset data
      description: 'Updates only the provided asset items (identified by uid). Unmentioned assets are left unchanged.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetDataRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/assets/{uid}:
    delete:
      tags: [User Info - Assets]
      summary: Delete a single post-FFP asset
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the asset to delete (returned by GET /user-info/assets)
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/life-stages:
    get:
      tags: [User Info - Stages]
      summary: Get stage data
      description: 'Returns the saved stage data for the authenticated user.'
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStageDataResponse'
    post:
      tags: [User Info - Stages]
      summary: Create stage data
      description: "Creates only the stage rows included in this request. The frontend can first fetch the eligible stages from GET /reference/life-stage-ranges?birthYear=YYYY, let the user fill values for those returned stages, then submit the selected stage items here. Every submitted lifeStageRangeId must still be eligible for the authenticated user's birth year, and existing stage rows in the profile cannot be created again."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStageDataRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Profile not found
    patch:
      tags: [User Info - Stages]
      summary: Partially update stage data
      description: 'Updates only the provided stage items (identified by lifeStageRangeId). Unmentioned stages are left unchanged.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStageDataRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /user-info/lifestyle:
    patch:
      tags: [User Info - Lifestyle]
      summary: Update lifestyle profile
      description: 'Updates all four lifestyle habits at once (smoking, physical activity, diet quality, alcohol consumption). All four fields are required. Returns the updated lifestyle and recalculated estimated life expectancy.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifestyleProfileRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLifestyleProfileResponse'
        401:
          description: Unauthorized
        404:
          description: Profile not found

  /scenario-1/input:
    get:
      tags: [Scenario 1]
      summary: Get scenario 1 input
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario1InputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 1 input not found
    post:
      tags: [Scenario 1]
      summary: Create scenario 1 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario1InputRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario1InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [Scenario 1]
      summary: Update scenario 1 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario1InputRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario1InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Scenario 1 input not found

  /scenario-1/output:
    get:
      tags: [Scenario 1]
      summary: Get scenario 1 output
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario1OutputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 1 output not found

  /scenario-2/input:
    get:
      tags: [Scenario 2]
      summary: Get scenario 2 input
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario2InputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 2 input not found
    post:
      tags: [Scenario 2]
      summary: Create scenario 2 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario2InputRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario2InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
    patch:
      tags: [Scenario 2]
      summary: Update scenario 2 input
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario2InputRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario2InputResponse'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Scenario 2 input not found

  /scenario-2/output:
    get:
      tags: [Scenario 2]
      summary: Get scenario 2 output
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario2OutputResponse'
        401:
          description: Unauthorized
        404:
          description: Scenario 2 output not found
  /reference/currencies:
    get:
      tags: [Reference]
      summary: List currencies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyListResponse'

  /reference/countries:
    get:
      tags: [Reference]
      summary: List countries
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'

  /reference/sex-types:
    get:
      tags: [Reference]
      summary: List sex types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SexTypeListResponse'

  /reference/asset-types:
    get:
      tags: [Reference]
      summary: List asset types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetTypeListResponse'

  /reference/scenario-types:
    get:
      tags: [Reference]
      summary: List scenario types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioTypeListResponse'

  /reference/life-stage-ranges:
    get:
      tags: [Reference]
      summary: List life stage ranges
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/BirthYear'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifeStageRangeListResponse'

  /reference/smoking-types:
    get:
      tags: [Reference]
      summary: List smoking types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmokingTypeListResponse'

  /reference/physical-activity-types:
    get:
      tags: [Reference]
      summary: List physical activity types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalActivityTypeListResponse'

  /reference/diet-quality-types:
    get:
      tags: [Reference]
      summary: List diet quality types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietQualityTypeListResponse'

  /reference/alcohol-consumption-types:
    get:
      tags: [Reference]
      summary: List alcohol consumption types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlcoholConsumptionTypeListResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum: [asc, desc]
    BirthYear:
      in: query
      name: birthYear
      schema:
        type: integer
  schemas:
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        sort:
          type: string
          enum: [asc, desc]
    ApiResponseBase:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        path:
          type: string
        message:
          type: string
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: ok
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null
    User:
      type: object
      properties:
        id:
          type: string
          description: External UUID
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
                user:
                  $ref: '#/components/schemas/User'
                isFirstLogin:
                  type: boolean
    RefreshResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
    RegisterRequest:
      type: object
      required: [email, password, name, birthYear, countryId, sexTypeId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        birthYear:
          type: integer
        countryId:
          type: integer
        sexTypeId:
          type: integer
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
    FinancialProfileRequest:
      type: object
      required: [desiredLifeExpectancy, currentSavings, currencyId]
      properties:
        desiredLifeExpectancy:
          type: integer
        currentSavings:
          type: number
        currencyId:
          type: integer
          example: 1
    PortfolioAllocationRequest:
      type: object
      required: [allocationType, u, mu, rf]
      properties:
        allocationType:
          type: string
          enum: [PRE_FFP, POST_FFP]
        u:
          type: number
          exclusiveMinimum: 0
        mu:
          type: number
          exclusiveMinimum: -1
        rf:
          type: number
          exclusiveMinimum: -1
    CreateAssetItem:
      type: object
      required: [assetTypeId, initialAnnualIncome, growthRate]
      properties:
        assetTypeId:
          type: integer
        initialAnnualIncome:
          type: number
          minimum: 0
        growthRate:
          type: number
          exclusiveMinimum: -1
    CreateAssetsRequest:
      type: object
      required: [assetData]
      properties:
        assetData:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateAssetItem'
    CreatedAssetItem:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        initialAnnualIncome:
          type: number
        growthRate:
          type: number
          exclusiveMinimum: -1
    CreateAssetsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CreatedAssetItem'
    ListAssetsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AssetDataResponse'
    LifestyleProfileRequest:
      type: object
      required:
        [
          smokingTypeId,
          physicalActivityTypeId,
          dietQualityTypeId,
          alcoholConsumptionTypeId,
        ]
      properties:
        smokingTypeId:
          type: integer
          example: 1
        physicalActivityTypeId:
          type: integer
          example: 2
        dietQualityTypeId:
          type: integer
          example: 3
        alcoholConsumptionTypeId:
          type: integer
          example: 4
    StageDataRequest:
      type: object
      required: [lifeStageRangeId, initialAnnualSavings, growthRate]
      properties:
        lifeStageRangeId:
          type: integer
          description: Life stage range ID previously returned by the server for this user's birth year.
        initialAnnualSavings:
          type: number
        growthRate:
          type: number
          exclusiveMinimum: -1
    AssetDataRequest:
      type: object
      required: [assetTypeId, initialAnnualIncome, growthRate]
      properties:
        assetTypeId:
          type: integer
        initialAnnualIncome:
          type: number
        growthRate:
          type: number
          exclusiveMinimum: -1
    UpdateFinancialProfileBasicRequest:
      type: object
      description: At least one field must be provided. estimatedLifeExpectancy is read-only and excluded.
      properties:
        currentSavings:
          type: number
          minimum: 0
        desiredLifeExpectancy:
          type: integer
          minimum: 1
          maximum: 150
        currencyId:
          type: integer
          description: Currency ID from the reference list
          example: 1
    UpdatePortfolioAllocationsRequest:
      type: array
      description: Must contain exactly two items — one PRE_FFP and one POST_FFP.
      minItems: 2
      maxItems: 2
      items:
        $ref: '#/components/schemas/PortfolioAllocationRequest'
    UpdateStageItemRequest:
      type: object
      required: [lifeStageRangeId]
      description: At least one of initialAnnualSavings or growthRate must be provided.
      properties:
        lifeStageRangeId:
          type: integer
          description: Must be a lifeStageRangeId already in this profile.
        initialAnnualSavings:
          type: number
        growthRate:
          type: number
    UpdateStageDataRequest:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/UpdateStageItemRequest'
    CreateStageDataRequest:
