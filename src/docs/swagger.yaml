            application/json:
              schema:
                $ref: '#/components/schemas/SmokingTypeListResponse'

  /reference/physical-activity-types:
    get:
      tags: [Reference]
      summary: List physical activity types
      description: Returns localized titles when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalActivityTypeListResponse'

  /reference/diet-quality-types:
    get:
      tags: [Reference]
      summary: List diet quality types
      description: Returns localized titles when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietQualityTypeListResponse'

  /reference/alcohol-consumption-types:
    get:
      tags: [Reference]
      summary: List alcohol consumption types
      description: Returns localized titles when a supported Accept-Language header is provided.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlcoholConsumptionTypeListResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum: [asc, desc]
    AcceptLanguage:
      in: header
      name: Accept-Language
      required: false
      description: Selects localized reference labels. Supported languages are en and vi; language-region tags such as vi-VN are accepted. Unsupported or missing values default to en.
      schema:
        type: string
        example: vi-VN,vi;q=0.9,en;q=0.8
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
    BirthYear:
      in: query
      name: birthYear
      schema:
        type: integer
  responses:
    BadRequestError:
      description: Bad request or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    AuthRateLimitError:
      description: Too many auth requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    EmailVerificationRateLimitError:
      description: Too many email verification attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    PasswordResetRateLimitError:
      description: Too many password reset attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        sort:
          type: string
          enum: [asc, desc]
    ApiResponseBase:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    ApiErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: false
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: Validation error
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        stack:
          type: string
          description: Included only in development responses.
    ErrorCode:
      type: string
      description: Machine-readable error code.
      enum:
        - VALIDATION.INVALID_INPUT
        - VALIDATION.FIELD_INVALID
        - VALIDATION.INVALID_JSON
        - VALIDATION.BAD_REQUEST
        - AUTH.UNAUTHORIZED
        - AUTH.FORBIDDEN
        - AUTH.NO_TOKEN
        - AUTH.INVALID_TOKEN
        - AUTH.INVALID_CSRF_TOKEN
        - AUTH.MISSING_REFRESH_TOKEN
        - AUTH.EMAIL_EXISTS
        - AUTH.INVALID_CREDENTIALS
        - AUTH.EMAIL_NOT_VERIFIED
        - AUTH.INVALID_OR_EXPIRED_TOKEN
        - AUTH.CURRENT_PASSWORD_INCORRECT
        - AUTH.NEW_PASSWORD_REUSED
        - AUTH.INVALID_REFRESH_TOKEN
        - RATE_LIMIT.AUTH
        - RATE_LIMIT.EMAIL_VERIFICATION
        - RATE_LIMIT.PASSWORD_RESET
        - SYSTEM.ROUTE_NOT_FOUND
        - SYSTEM.NOT_FOUND
        - SYSTEM.ERROR
        - SYSTEM.INTERNAL_ERROR
        - SYSTEM.UNKNOWN
    ErrorDetail:
      type: object
      properties:
        path:
          type: string
          example: password
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: Password must be at least 8 characters
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: ok
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null
    User:
      type: object
      properties:
        id:
          type: string
          description: External UUID
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
                user:
                  $ref: '#/components/schemas/User'
                isFirstLogin:
                  type: boolean
    RefreshResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
    RegisterRequest:
      type: object
      required: [email, password, name, birthYear, countryId, sexTypeId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        birthYear:
          type: integer
        countryId:
          type: integer
        sexTypeId:
          type: integer
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResendVerificationEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
    UpdatePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 100
    FinancialProfileRequest:
      type: object
      required: [desiredLifeExpectancy, currentSavings, currencyId]
      properties:
        desiredLifeExpectancy:
          type: integer
        currentSavings:
          type: number
        currencyId:
          type: integer
          example: 1
    PortfolioAllocationRequest:
      type: object
      required: [allocationType, u, mu, rf]
      properties:
        allocationType:
          type: string
          enum: [PRE_FFP, POST_FFP]
        u:
          type: number
          inclusiveMinimum: 0
          inclusiveMaximum: 1
        mu:
          type: number
          exclusiveMinimum: -1
        rf:
          type: number
          exclusiveMinimum: -1
    CreateAssetItem:
      type: object
      required: [assetTypeId, initialAnnualIncome, growthRate]
      properties:
        assetTypeId:
          type: integer
        initialAnnualIncome:
          type: number
          minimum: 0
        growthRate:
          type: number
          exclusiveMinimum: -1
    CreateAssetsRequest:
      type: object
      required: [assetData]
      properties:
        assetData:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateAssetItem'
    CreatedAssetItem:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        initialAnnualIncome:
          type: number
        growthRate:
          type: number
          exclusiveMinimum: -1
    CreateAssetsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CreatedAssetItem'
    ListAssetsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AssetDataResponse'
    LifestyleProfileRequest:
      type: object
      required:
        [
          smokingTypeId,
          physicalActivityTypeId,
          dietQualityTypeId,
          alcoholConsumptionTypeId,
        ]
      properties:
        smokingTypeId:
          type: integer
          example: 1
        physicalActivityTypeId:
          type: integer
          example: 2
        dietQualityTypeId:
          type: integer
          example: 3
        alcoholConsumptionTypeId:
          type: integer
          example: 4
    StageDataRequest:
      type: object
      required: [lifeStageRangeId, initialAnnualSavings, growthRate]
      properties:
        lifeStageRangeId:
          type: integer
          description: Life stage range ID previously returned by the server for this user's birth year.
        initialAnnualSavings:
          type: number
          inclusiveMinimum: 0
        growthRate:
          type: number
          exclusiveMinimum: -1
    AssetDataRequest:
      type: object
      required: [assetTypeId, initialAnnualIncome, growthRate]
      properties:
        assetTypeId:
          type: integer
        initialAnnualIncome:
          type: number
        growthRate:
          type: number
          exclusiveMinimum: -1
    UpdateFinancialProfileBasicRequest:
      type: object
      description: At least one field must be provided. estimatedLifeExpectancy is read-only and excluded.
      properties:
        currentSavings:
          type: number
          minimum: 0
        desiredLifeExpectancy:
          type: integer
          minimum: 1
          maximum: 150
        currencyId:
          type: integer
          description: Currency ID from the reference list
          example: 1
    UpdatePortfolioAllocationsRequest:
      type: array
      description: Must contain exactly two items — one PRE_FFP and one POST_FFP.
      minItems: 2
      maxItems: 2
      items:
        $ref: '#/components/schemas/PortfolioAllocationRequest'
    UpdateStageItemRequest:
      type: object
      required: [lifeStageRangeId]
      description: At least one of initialAnnualSavings or growthRate must be provided.
      properties:
        lifeStageRangeId:
          type: integer
          description: Must be a lifeStageRangeId already in this profile.
        initialAnnualSavings:
          type: number
          exclusiveMinimum: 0
        growthRate:
          type: number
    UpdateStageDataRequest:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/UpdateStageItemRequest'
    CreateStageDataRequest:
      type: array
      description: One or more stage items selected from the life stages previously returned by GET /reference/life-stage-ranges for the user's birth year.
      minItems: 1
      items:
        $ref: '#/components/schemas/StageDataRequest'
    UpdateAssetItemRequest:
      type: object
      required: [uid]
      description: At least one of initialAnnualIncome or growthRate must be provided.
      properties:
        uid:
          type: string
          format: uuid
          description: UUID of the asset to update (returned by GET /user-info/assets).
        initialAnnualIncome:
          type: number
          minimum: 0
        growthRate:
          type: number
    UpdateAssetDataRequest:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/UpdateAssetItemRequest'
    FinancialProfileData:
      type: object
      required:
        [
          currentSavings,
          desiredLifeExpectancy,
          estimatedLifeExpectancy,
          currencyId,
        ]
      properties:
        currentSavings:
          type: number
        desiredLifeExpectancy:
          type: integer
        estimatedLifeExpectancy:
          type: integer
        currencyId:
          type: integer
    PortfolioAllocationData:
      type: object
      required: [allocationType, u, mu, rf]
      properties:
        allocationType:
          type: string
          enum: [PRE_FFP, POST_FFP]
        u:
          type: number
        mu:
          type: number
        rf:
          type: number
    StageDataResponse:
      type: object
      properties:
        lifeStageRangeId:
          type: integer
        stageNo:
          type: integer
          nullable: true
        title:
          type: string
        beginningAge:
          type: integer
          nullable: true
        endingAge:
          type: integer
          nullable: true
        initialAnnualSavings:
          type: number
          nullable: true
        growthRate:
          type: number
          nullable: true
    AssetDataResponse:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: UUID of this asset — use this to update or delete the specific asset.
        assetId:
          type: integer
        assetTypeCode:
          type: string
          nullable: true
        assetTypeTitle:
          type: string
          nullable: true
        initialAnnualIncome:
          type: number
          nullable: true
        growthRate:
          type: number
          nullable: true
    LifestyleProfileResponse:
      type: object
      required:
        [
          smokingTypeId,
          physicalActivityTypeId,
          dietQualityTypeId,
          alcoholConsumptionTypeId,
        ]
      properties:
        smokingTypeId:
          type: integer
        physicalActivityTypeId:
          type: integer
        dietQualityTypeId:
          type: integer
        alcoholConsumptionTypeId:
          type: integer
    FinancialInfo:
      type: object
      required: [financialProfile, portfolioAllocations, lifestyleProfile]
      properties:
        financialProfile:
          $ref: '#/components/schemas/FinancialProfileRequest'
        portfolioAllocations:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PortfolioAllocationRequest'
        lifestyleProfile:
          $ref: '#/components/schemas/LifestyleProfileRequest'
    FinancialInfoEnvelope:
      type: object
      properties:
        financial:
          $ref: '#/components/schemas/FinancialInfo'
    UpdateFinancialInfoRequest:
      type: object
      required: [financial]
      properties:
        financial:
          type: object
          description: At least one of financialProfile, portfolioAllocations, or lifestyleProfile must be provided.
          properties:
            financialProfile:
              $ref: '#/components/schemas/UpdateFinancialProfileBasicRequest'
            portfolioAllocations:
              $ref: '#/components/schemas/UpdatePortfolioAllocationsRequest'
            lifestyleProfile:
              $ref: '#/components/schemas/LifestyleProfileRequest'
    GetFinancialInfo:
      type: object
      required: [financialProfile, portfolioAllocations, lifestyleProfile]
      properties:
        financialProfile:
          $ref: '#/components/schemas/FinancialProfileData'
        portfolioAllocations:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PortfolioAllocationData'
        lifestyleProfile:
          $ref: '#/components/schemas/LifestyleProfileResponse'
    GetFinancialInfoEnvelope:
      type: object
      properties:
        financial:
          $ref: '#/components/schemas/GetFinancialInfo'
    GetFinancialInfoResponse:
      allOf:
